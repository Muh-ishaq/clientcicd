services:
  website:
    container_name: client
    image: ${DOCKERHUB_USERNAME:-ishaq0925}/${IMAGE_NAME:-client}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
