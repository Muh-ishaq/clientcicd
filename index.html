<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff6f0">
    <meta
      name="description"
      content="A warm welcome from Client, always here to help."
    >
    <title>Client — Always Here to Help</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #473b42;
        background: #fff8f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --rose: #bf7186;
        --leaf: #64896d;
        --ink: #473b42;
        --muted: #71636a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 17% 12%, rgb(255 222 208 / 72%), transparent 29rem),
          radial-gradient(ellipse at 88% 84%, rgb(218 235 207 / 78%), transparent 33rem),
          linear-gradient(145deg, #fff8f2, #fffdf8 55%, #f6f7ed);
      }

      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 2rem 1.25rem;
        isolation: isolate;
      }

      .glow {
        position: absolute;
        z-index: -1;
        width: min(72vw, 42rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: rgb(255 255 255 / 54%);
        filter: blur(2px);
      }

      .welcome {
        width: min(100%, 56rem);
        padding: clamp(2rem, 6vw, 4.5rem);
        border: 1px solid rgb(255 255 255 / 82%);
        border-radius: 2rem;
        background: rgb(255 255 255 / 66%);
        box-shadow: 0 2rem 6rem rgb(116 89 83 / 12%), inset 0 1px #fff;
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .mark {
        display: grid;
        width: 3.25rem;
        aspect-ratio: 1;
        place-items: center;
        margin: 0 auto 1.5rem;
        border: 1px solid rgb(191 113 134 / 28%);
        border-radius: 50%;
        color: var(--rose);
        background: #fff7f5;
        font-size: 1.35rem;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--leaf);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 15ch;
        margin: 0 auto;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.4rem, 7vw, 5rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.04;
        text-wrap: balance;
      }

      h1 span {
        color: var(--rose);
        font-style: italic;
      }

      .intro {
        max-width: 36rem;
        margin: 1.4rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.14rem);
        line-height: 1.8;
        text-wrap: pretty;
      }

      .garden {
        width: min(100%, 31rem);
        margin: 2rem auto 0;
      }

      .garden svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .stem {
        fill: none;
        stroke: #64896d;
        stroke-linecap: round;
        stroke-width: 7;
      }

      .leaf {
        fill: #82a681;
      }

      .petal-pink {
        fill: #eaa4b1;
      }

      .petal-peach {
        fill: #f2b28f;
      }

      .petal-lilac {
        fill: #b7a5d5;
      }

      .flower-center {
        fill: #f3cf75;
      }

      figcaption {
        margin-top: 0.7rem;
        color: var(--leaf);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.05rem;
        font-style: italic;
      }

      footer {
        margin-top: 2rem;
        color: #81717a;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
      }

      @media (max-width: 520px) {
        .page {
          padding: 1rem;
        }

        .welcome {
          padding: 2rem 1.25rem;
          border-radius: 1.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="glow" aria-hidden="true"></div>
      <section class="welcome" aria-labelledby="welcome-title">
        <div class="mark" aria-hidden="true">✿</div>
        <p class="eyebrow">A little kindness goes a long way</p>
        <h1 id="welcome-title">I am Client, and I am always here to <span>help.</span></h1>
        <p class="intro">
          Whatever you need, you deserve a friendly hand and a thoughtful answer.
          Take a breath, tell me what is on your mind, and we will work it out together.
        </p>

        <figure class="garden">
          <svg viewBox="0 0 480 270" role="img" aria-labelledby="flowers-title">
            <title id="flowers-title">A cheerful little garden of pink, peach, and lilac flowers</title>
            <path class="stem" d="M238 237c-2-55 1-102 5-157M240 222c-36-40-59-68-77-113M243 219c34-43 58-73 90-107M203 238c-10-42-17-69-30-96M278 237c13-41 22-68 39-94"></path>
            <path class="leaf" d="M217 186c-35-36-67-35-72-30 4 25 36 42 72 30Zm43 3c22-39 52-49 61-45-3 26-28 45-61 45Zm-72 26c-28-28-52-28-59-23 4 21 29 34 59 23Zm75 3c19-33 42-39 50-35-2 21-23 38-50 35Z"></path>
            <g transform="translate(243 71)">
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22"></ellipse>
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22" transform="rotate(45)"></ellipse>
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22" transform="rotate(90)"></ellipse>
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22" transform="rotate(135)"></ellipse>
              <circle class="flower-center" r="11"></circle>
            </g>
            <g transform="translate(163 111) scale(.82)">
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22"></ellipse>
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22" transform="rotate(45)"></ellipse>
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22" transform="rotate(90)"></ellipse>
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22" transform="rotate(135)"></ellipse>
              <circle class="flower-center" r="11"></circle>
            </g>
            <g transform="translate(333 110) scale(.9)">
              <ellipse class="petal-lilac" cy="-23" rx="11" ry="22"></ellipse>
              <ellipse class="petal-lilac" cy="-23" rx="11" ry="22" transform="rotate(45)"></ellipse>
              <ellipse class="petal-lilac" cy="-23" rx="11" ry="22" transform="rotate(90)"></ellipse>
              <ellipse class="petal-lilac" cy="-23" rx="11" ry="22" transform="rotate(135)"></ellipse>
              <circle class="flower-center" r="11"></circle>
            </g>
            <g transform="translate(173 143) scale(.58)">
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22"></ellipse>
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22" transform="rotate(45)"></ellipse>
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22" transform="rotate(90)"></ellipse>
              <ellipse class="petal-pink" cy="-23" rx="11" ry="22" transform="rotate(135)"></ellipse>
              <circle class="flower-center" r="11"></circle>
            </g>
            <g transform="translate(315 142) scale(.62)">
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22"></ellipse>
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22" transform="rotate(45)"></ellipse>
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22" transform="rotate(90)"></ellipse>
              <ellipse class="petal-peach" cy="-23" rx="11" ry="22" transform="rotate(135)"></ellipse>
              <circle class="flower-center" r="11"></circle>
            </g>
            <path d="M174 238h132c-8 17-28 26-66 26s-58-9-66-26Z" fill="#d89e91"></path>
            <path d="M184 242c19 7 92 7 112 0" fill="none" stroke="#f4d0b9" stroke-linecap="round" stroke-width="4"></path>
            <path d="M161 238h158" fill="none" stroke="#b87877" stroke-linecap="round" stroke-width="5"></path>
          </svg>
          <figcaption>Here for you, one kind moment at a time.</figcaption>
        </figure>

        <footer>With care, always.</footer>
      </section>
    </main>
  </body>
</html>
